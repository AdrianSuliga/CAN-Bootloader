# Logger module
CONFIG_LOG=y
CONFIG_LOG_MAX_LEVEL=3

# Watchdog
CONFIG_WATCHDOG=y

# CAN
CONFIG_CAN=y

# Memory
CONFIG_MAIN_STACK_SIZE=5200
CONFIG_NET_TX_STACK_SIZE=2048
CONFIG_NET_RX_STACK_SIZE=2048

CONFIG_NET_PKT_RX_COUNT=10
CONFIG_NET_PKT_TX_COUNT=10
CONFIG_NET_BUF_RX_COUNT=20
CONFIG_NET_BUF_TX_COUNT=20
CONFIG_NET_MAX_CONTEXTS=10
CONFIG_INIT_STACKS=y

# Networking
CONFIG_NETWORKING=y
CONFIG_POSIX_API=y
CONFIG_NET_DHCPV4=y
CONFIG_DNS_RESOLVER=y
CONFIG_NET_TCP=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n

# WiFi
CONFIG_WIFI=y

# MQTT
CONFIG_MQTT_LIB=y
CONFIG_MQTT_CLEAN_SESSION=y

# CRC
CONFIG_CRC=y

# User configurable
CONFIG_WIFI_SSID="Ryszard"
CONFIG_WIFI_PSK="jestnatrello"
CONFIG_MQTT_CLIENT_NAME="zephyr_gateway_board_client"
CONFIG_MQTT_BROKER_ADDRESS="broker.hivemq.com"
CONFIG_MQTT_BROKER_PORT=1883
CONFIG_MQTT_PUBLISH_TOPIC="system/gateway_board/publish/state"
CONFIG_MQTT_SUBSCRIBE_TOPIC="system/gateway_board/subscribe/new_app"

# Set only if different than default
#CONFIG_WATCHDOG_TIMEOUT=
#CONFIG_MQTT_MESSAGE_RX_BUFFER_SIZE=
#CONFIG_MQTT_MESSAGE_TX_BUFFER_SIZE=
